{% extends 'base.html' %}

{% block content %}

<div class="p-8">

    <h1 class="text-3xl font-bold mb-8">
        Select Shop
    </h1>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        {% for shop in shops %}

        <div class="bg-white shadow-xl rounded-2xl p-6 border">

            <h2 class="text-2xl font-semibold mb-4">
                {{ shop.name }}
            </h2>

            <a href="/staff/{{ shop.slug }}/"
               class="bg-blue-600 text-white px-5 py-3 rounded-xl inline-block hover:bg-blue-700">
                Manage Staff
            </a>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
