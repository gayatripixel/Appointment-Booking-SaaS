{% extends "base.html" %}

{% block content %}

<div class="max-w-3xl mx-auto py-8 px-4">

    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-800">
            Add Follow Up
        </h1>

        <p class="text-gray-500 mt-2">
            Schedule customer follow up reminders
        </p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-3xl shadow-xl border border-gray-100 p-8">

        <form method="POST" class="space-y-6">

            {% csrf_token %}

            <!-- Booking -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Select Customer Booking
                </label>

                <select
                    name="booking"
                    required
                    class="w-full rounded-2xl border border-gray-200 px-4 py-3 focus:ring-2 focus:ring-purple-500 focus:border-purple-500">

                    <option value="">
                        Choose Booking
                    </option>

                    {% for booking in bookings %}
                    <option value="{{ booking.id }}">
                        {{ booking.customer_display_name }} - {{ booking.service.name }}
                    </option>
                    {% endfor %}

                </select>
            </div>

            <!-- Date + Time -->
            <div class="grid md:grid-cols-2 gap-4">

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Follow Up Date
                    </label>

                    <input
                        type="date"
                        name="followup_date"
                        required
                        class="w-full rounded-2xl border border-gray-200 px-4 py-3 focus:ring-2 focus:ring-purple-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Follow Up Time
                    </label>

                    <input
                        type="time"
                        name="followup_time"
                        class="w-full rounded-2xl border border-gray-200 px-4 py-3 focus:ring-2 focus:ring-purple-500">
                </div>

            </div>

            <!-- Notes -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Notes
                </label>

                <textarea
                    name="notes"
                    rows="4"
                    placeholder="Call customer regarding service feedback..."
                    class="w-full rounded-2xl border border-gray-200 px-4 py-3 focus:ring-2 focus:ring-purple-500"></textarea>
            </div>

            <!-- Buttons -->
            <div class="flex gap-3 pt-4">

                <button
                    type="submit"
                    class="px-6 py-3 rounded-2xl bg-gradient-to-r from-purple-600 to-pink-500 text-white font-semibold shadow-lg hover:scale-105 transition">

                    🔔 Save Follow Up

                </button>

                <a
                    href="{% url 'dashboard:index' %}"
                    class="px-6 py-3 rounded-2xl border border-gray-300 text-gray-700 hover:bg-gray-100 transition">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
