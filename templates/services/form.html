{% extends 'base.html' %}

{% block content %}

<div class="min-h-screen bg-gray-50 py-10 px-4">

    <div class="max-w-3xl mx-auto">

        <div class="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden">

            <!-- Top Header -->
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 px-8 py-6">

                <h1 class="text-3xl font-bold text-white">
                    Edit Service
                </h1>

                <p class="text-blue-100 mt-2">
                    Update your shop service details
                </p>

            </div>

            <!-- Form -->
            <form method="POST" class="p-8 space-y-6">

                {% csrf_token %}

                <!-- Service Name -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Service Name
                    </label>

                    <input type="text"
                           name="name"
                           value="{{ form.name.value|default:'' }}"
                           class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- Price -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Price
                    </label>

                    <input type="number"
                           name="price"
                           value="{{ form.price.value|default:'' }}"
                           class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- Duration -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Duration (Minutes)
                    </label>

                    <input type="number"
                           name="duration"
                           value="{{ form.duration.value|default:'' }}"
                           class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- Description -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Description
                    </label>

                    <textarea name="description"
                              rows="4"
                              class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:ring-2 focus:ring-blue-500 focus:outline-none">{{ form.description.value|default:'' }}</textarea>
                </div>

                <!-- Buttons -->
                <div class="flex items-center gap-4 pt-4">

                    <button type="submit"
                            class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-4 rounded-2xl transition">
                        Save Changes
                    </button>

                    <a href="/services/{{ shop.slug }}/"
                       class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold px-8 py-4 rounded-2xl transition">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
