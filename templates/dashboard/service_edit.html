{% extends 'base.html' %}

{% block content %}

<div class="max-w-2xl mx-auto mt-10 bg-white p-8 rounded-2xl shadow">

    <h2 class="text-2xl font-bold mb-6 text-gray-800">
        Edit Service
    </h2>

    <form method="POST" class="space-y-5">
        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-xl transition"
        >
            Update Service
        </button>
    </form>

</div>

{% endblock %}
