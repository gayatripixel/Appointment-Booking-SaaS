{% extends "base.html" %}

{% block content %}

<div class="p-6">
    
    <div class="mb-6">
        <h1 class="text-3xl font-bold text-gray-800">
            Reports Dashboard
        </h1>
        <p class="text-gray-500 mt-1">
            Analytics and business insights
        </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

        <div class="bg-white rounded-2xl shadow p-5 border">
            <h2 class="text-sm text-gray-500">Total Revenue</h2>
            <p class="text-3xl font-bold mt-2 text-green-600">
                ₹1,24,500
            </p>
        </div>

        <div class="bg-white rounded-2xl shadow p-5 border">
            <h2 class="text-sm text-gray-500">Appointments</h2>
            <p class="text-3xl font-bold mt-2 text-blue-600">
                1,250
            </p>
        </div>

        <div class="bg-white rounded-2xl shadow p-5 border">
            <h2 class="text-sm text-gray-500">Customers</h2>
            <p class="text-3xl font-bold mt-2 text-purple-600">
                420
            </p>
        </div>

        <div class="bg-white rounded-2xl shadow p-5 border">
            <h2 class="text-sm text-gray-500">Growth</h2>
            <p class="text-3xl font-bold mt-2 text-pink-600">
                +18%
            </p>
        </div>

    </div>

    <div class="bg-white mt-8 rounded-2xl shadow border p-6">
        <h2 class="text-xl font-semibold mb-4">
            Monthly Performance
        </h2>

        <div class="space-y-4">

            <div>
                <div class="flex justify-between mb-1">
                    <span>January</span>
                    <span>70%</span>
                </div>

                <div class="w-full bg-gray-200 rounded-full h-3">
                    <div class="bg-blue-500 h-3 rounded-full w-[70%]"></div>
                </div>
            </div>

            <div>
                <div class="flex justify-between mb-1">
                    <span>February</span>
                    <span>85%</span>
                </div>

                <div class="w-full bg-gray-200 rounded-full h-3">
                    <div class="bg-green-500 h-3 rounded-full w-[85%]"></div>
                </div>
            </div>

            <div>
                <div class="flex justify-between mb-1">
                    <span>March</span>
                    <span>60%</span>
                </div>

                <div class="w-full bg-gray-200 rounded-full h-3">
                    <div class="bg-pink-500 h-3 rounded-full w-[60%]"></div>
                </div>
            </div>

        </div>
    </div>

</div>

{% endblock %}
